<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Arcade</title>
<style>
:root{--bg1:#f3f0ff;--bg2:#dbeafe;--panel:#ffffffb8;--line:#1b1b2f1c;--text:#1b1b2f;--mut:#6b6b85;--a:#6d5efc;--b:#ec4899;--x:#e11d48;--o:#2563eb;--ok:#16a34a;--warn:#d97706;--cell:#eceefb;--shadow:0 10px 30px #4b3fa322;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#12121c;--bg2:#1c1840;--panel:#23233a99;--line:#ffffff1f;--text:#e8e8f5;--mut:#9a9ab8;--a:#9d8cff;--b:#f472b6;--x:#fb7185;--o:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--cell:#1a1a2c;--shadow:0 10px 30px #0008;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#12121c;--bg2:#1c1840;--panel:#23233a99;--line:#ffffff1f;--text:#e8e8f5;--mut:#9a9ab8;--a:#9d8cff;--b:#f472b6;--x:#fb7185;--o:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--cell:#1a1a2c;--shadow:0 10px 30px #0008;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg1));background-size:300% 300%;animation:bg 20s ease infinite;background-color:var(--bg1);color:var(--text);min-height:100vh;display:flex;justify-content:center}
@keyframes bg{50%{background-position:100% 100%}}
.app{width:100%;max-width:560px;padding:16px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{font-weight:800;font-size:1.25rem;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
.chip{font-size:.8rem;padding:6px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);min-width:96px}
.chip i{display:block;height:4px;border-radius:4px;background:var(--line);margin-top:4px;overflow:hidden}
.chip i b{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .5s}
button,select{font:inherit;font-size:.9rem;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;transition:.15s;backdrop-filter:blur(8px)}
button:hover,select:hover{transform:translateY(-1px);border-color:var(--a)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pri{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border:0;font-weight:700}
.screen{display:none;animation:in .35s ease}.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
h2{font-size:1.2rem;margin-bottom:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:12px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.status{text-align:center;font-weight:700;min-height:26px;margin-bottom:10px}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gc{text-align:left;padding:16px;border-radius:18px;display:flex;flex-direction:column;gap:6px}
.gc .em{font-size:2.2rem}.gc b{font-size:1.05rem}.gc small{color:var(--mut)}.gc:hover{box-shadow:0 0 0 2px var(--a),var(--shadow)}
/* TTT */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:0 auto}
.cell{aspect-ratio:1;background:var(--cell);border-radius:14px;display:grid;place-items:center;font-size:clamp(2rem,12vw,3.2rem);font-weight:800;cursor:pointer;transition:.15s}
.cell:hover:empty{background:var(--line)}.cell.X{color:var(--x);animation:pop .25s}.cell.O{color:var(--o);animation:pop .25s}
.cell.win{background:var(--ok);color:#fff;animation:pulse .6s infinite alternate}
@keyframes pop{from{transform:scale(.3)}}@keyframes pulse{to{transform:scale(1.07)}}
.score{display:flex;justify-content:center;gap:18px;font-weight:700;margin-bottom:8px}
/* Snakes */
.sb{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0}
.sc{aspect-ratio:1;border-radius:10px;background:var(--cell);padding:3px;font-size:.7rem;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.sc.alt{filter:brightness(.96)}.sc.lad{box-shadow:inset 0 0 0 2px var(--ok)}.sc.snk{box-shadow:inset 0 0 0 2px var(--x)}
.sc b{color:var(--mut)}.sc i{font-style:normal;font-size:.65rem}.sc span{display:flex;gap:2px;justify-content:center}
.tk{width:14px;height:14px;border-radius:50%;display:block;border:2px solid #fff;animation:pop .25s}.p0{background:var(--x)}.p1{background:var(--o)}
.dice{font-size:3.2rem;line-height:1;text-align:center}
/* Flip */
.fb{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:8px;max-width:420px;margin:0 auto}
.fc{aspect-ratio:1;padding:0;border:0;background:none;perspective:600px}
.in{display:block;position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.up .in,.fc.ok .in{transform:rotateY(180deg)}
.fr,.bk{position:absolute;inset:0;display:grid;place-items:center;border-radius:12px;backface-visibility:hidden;font-size:clamp(1.3rem,7vw,2.1rem)}
.fr{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}.bk{background:var(--cell);transform:rotateY(180deg);border:1px solid var(--line)}
.fc.ok .bk{background:var(--ok);animation:pulse .4s 2 alternate}
/* Wordle */
.wg{display:grid;gap:6px;justify-content:center;margin-bottom:12px}.wr{display:flex;gap:6px}.wr.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.wt{width:clamp(44px,13vw,56px);aspect-ratio:1;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:1.6rem;font-weight:800;background:var(--cell)}
.wt.f{border-color:var(--a);animation:pop .12s}.wt.rev{animation:fl .5s}
@keyframes fl{50%{transform:rotateX(90deg)}}
.wt.correct,.key.correct{background:var(--ok);color:#fff;border-color:var(--ok)}.wt.present,.key.present{background:var(--warn);color:#fff;border-color:var(--warn)}.wt.absent,.key.absent{background:var(--mut);color:#fff;border-color:var(--mut);opacity:.8}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center}.kr{display:flex;gap:4px}
.key{padding:11px 0;min-width:30px;text-align:center;font-weight:700;font-size:.85rem;border-radius:8px;background:var(--cell);border:1px solid var(--line);cursor:pointer;user-select:none}.key.lg{padding:11px 10px}
.mut{color:var(--mut);font-size:.85rem;text-align:center;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--text);color:var(--bg1);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas><div id="toast"></div>
<div class="app">
<header>
  <div class="logo">🎮 Mini Arcade</div>
  <div class="chip"><span id="lv">Lv 1</span><i><b id="xpb" style="width:0"></b></i></div>
  <button id="snd" title="Suara">🔊</button><button id="thm" title="Tema">🌓</button>
</header>

<section id="hub" class="screen on">
  <div class="hub">
    <button class="card gc" data-go="ttt"><span class="em">❌</span><b>Tic-Tac-Toe</b><small id="h-ttt"></small></button>
    <button class="card gc" data-go="snk"><span class="em">🐍</span><b>Ular Tangga</b><small id="h-snk"></small></button>
    <button class="card gc" data-go="flip"><span class="em">🃏</span><b>Flip Card</b><small id="h-flip"></small></button>
    <button class="card gc" data-go="wd"><span class="em">🔤</span><b>Wordle ID</b><small id="h-wd"></small></button>
  </div>
  <p class="mut">Menang di game mana pun untuk dapat XP dan naik level. Progres tersimpan otomatis di perangkatmu.</p>
</section>

<section id="ttt" class="screen"><div class="card">
  <div class="top"><button data-go="hub">← Menu</button><h2>Tic-Tac-Toe</h2><button id="tNew" class="pri">Ronde Baru</button></div>
  <div class="bar">
    <select id="tMode"><option value="ai">Lawan Komputer</option><option value="pvp">2 Pemain</option></select>
    <select id="tDiff"><option value="easy">Mudah</option><option value="medium">Sedang</option><option value="hard">Sulit</option><option value="extreme" selected>Ekstrem</option></select>
  </div>
  <div class="score"><span style="color:var(--x)">X: <span id="sx">0</span></span><span style="color:var(--o)">O: <span id="so">0</span></span><span>Seri: <span id="sd">0</span></span></div>
  <div class="status" id="tSt"></div>
  <div class="board" id="tBoard"></div>
</div></section>

<section id="snk" class="screen"><div class="card">
  <div class="top"><button data-go="hub">← Menu</button><h2>Ular Tangga</h2><button id="sNew">Ulang</button></div>
  <div class="bar"><select id="sMode"><option value="ai">Lawan Komputer</option><option value="pvp">2 Pemain</option></select></div>
  <div class="status" id="sSt"></div>
  <div class="dice" id="sDice">🎲</div>
  <div class="sb" id="sBoard"></div>
  <div class="bar"><button id="sRoll" class="pri">Lempar Dadu 🎲</button></div>
  <p class="mut">Dapat angka 6 berarti giliran lagi. Garis hijau adalah tangga, garis merah adalah ular.</p>
</div></section>

<section id="flip" class="screen"><div class="card">
  <div class="top"><button data-go="hub">← Menu</button><h2>Flip Card</h2><button id="fNew" class="pri">Acak Ulang</button></div>
  <div class="bar"><select id="fDiff"><option value="easy">Mudah (12)</option><option value="medium" selected>Sedang (16)</option><option value="hard">Sulit (20)</option><option value="extreme">Ekstrem (30)</option></select></div>
  <div class="score"><span>⏱️ <span id="fTime">0</span> dtk</span><span>👣 <span id="fMoves">0</span></span><span>🎯 <span id="fLeft">0</span></span></div>
  <div class="fb" id="fBoard"></div>
  <p class="mut" id="fBest"></p>
</div></section>

<section id="wd" class="screen"><div class="card">
  <div class="top"><button data-go="hub">← Menu</button><h2>Wordle Indonesia</h2><button id="wNew" class="pri">Kata Baru</button></div>
  <div class="status" id="wMsg"></div>
  <div class="wg" id="wGrid"></div>
  <div class="kb" id="wKb"></div>
  <p class="mut"><label><input type="checkbox" id="wStrict"> Hanya terima kata dari daftar game</label></p>
  <p class="mut" id="wStat"></p>
</div></section>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.random()*n|0;
let S={};try{S=JSON.parse(localStorage.getItem('arcade')||'{}')}catch(e){}
S.sound??=true;S.xp??=0;S.best??={};S.wd??={w:0,l:0,s:0};S.tw??=0;S.sw??=0;
const save=()=>{try{localStorage.setItem('arcade',JSON.stringify(S))}catch(e){}};
const root=document.documentElement;if(S.theme)root.dataset.theme=S.theme;
/* Efek: suara, toast, confetti, XP */
let ac;function beep(f=440,d=.08,t='sine',v=.05){if(!S.sound)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function confetti(){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const p=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*15,vy:-Math.random()*13-2,r:Math.random()*6+3,c:`hsl(${rnd(360)} 90% 60%)`,l:100}));(function f(){x.clearRect(0,0,c.width,c.height);let a=0;p.forEach(q=>{if(q.l-->0){a=1;q.x+=q.vx;q.y+=q.vy;q.vy+=.35;x.fillStyle=q.c;x.fillRect(q.x,q.y,q.r,q.r*1.6)}});if(a)requestAnimationFrame(f)})()}
function lvl(){return Math.floor(Math.sqrt(S.xp/40))+1}
function xpUI(){const l=lvl(),a=40*(l-1)**2,b=40*l*l;$('#lv').textContent='Lv '+l;$('#xpb').style.width=((S.xp-a)/(b-a)*100)+'%'}
function addXp(n){const o=lvl();S.xp+=n;if(lvl()>o){toast(`Naik ke level ${lvl()}! 🚀`);beep(900,.3,'triangle')}else toast(`+${n} XP`);xpUI();save()}
function winFx(xp){confetti();[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle'),i*110));addXp(xp)}
/* Navigasi */
function go(id){$$('.screen').forEach(s=>s.classList.toggle('on',s.id==id));if(id=='hub')hub();if(id=='ttt')tInit();if(id=='snk')sInit();if(id=='flip')fInit();if(id=='wd')wInit();beep(600,.05)}
$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
function hub(){const b=S.best;$('#h-ttt').textContent=`Menang vs AI: ${S.tw}`;$('#h-snk').textContent=`Menang vs AI: ${S.sw}`;$('#h-flip').textContent=b.fmedium?`Terbaik (sedang): ${b.fmedium.t} dtk`:'Belum ada rekor';$('#h-wd').textContent=`Menang ${S.wd.w} · Streak ${S.wd.s}`}
$('#snd').onclick=()=>{S.sound=!S.sound;$('#snd').textContent=S.sound?'🔊':'🔇';save();beep()};$('#snd').textContent=S.sound?'🔊':'🔇';
$('#thm').onclick=()=>{const d=(root.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark';S.theme=d?'light':'dark';root.dataset.theme=S.theme;save()};

/* ===== TIC-TAC-TOE ===== */
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let tb,tp,ta,tr=0;const tsc={X:0,O:0,D:0};
for(let i=0;i<9;i++){const c=document.createElement('div');c.className='cell';c.onclick=()=>{if($('#tMode').value=='ai'&&tp=='O')return;tMove(i)};$('#tBoard').appendChild(c)}
const tc=()=>$$('#tBoard .cell'),tSt=m=>$('#tSt').textContent=m;
const win=b=>{for(const l of L)if(b[l[0]]&&b[l[0]]==b[l[1]]&&b[l[0]]==b[l[2]])return l;return null};
function mm(b,p){const w=win(b);if(w)return{s:b[w[0]]=='O'?1:-1};const e=b.map((v,i)=>v?null:i).filter(v=>v!==null);if(!e.length)return{s:0};let best={s:p=='O'?-2:2};for(const i of e){b[i]=p;const r=mm(b,p=='O'?'X':'O');b[i]='';if(p=='O'?r.s>best.s:r.s<best.s)best={s:r.s,m:i}}return best}
function tInit(){tb=Array(9).fill('');tp='X';ta=true;tc().forEach(c=>{c.textContent='';c.className='cell'});const ai=$('#tMode').value=='ai';$('#tDiff').style.display=ai?'':'none';$('#sx').textContent=tsc.X;$('#so').textContent=tsc.O;$('#sd').textContent=tsc.D;
  if(ai&&tr%2){tp='O';tSt('Komputer jalan duluan…');setTimeout(tAI,500)}else tSt(ai?'Giliranmu (X)':'Giliran X')}
function tMove(i){if(tb[i]||!ta)return;tb[i]=tp;const c=tc()[i];c.textContent=tp;c.classList.add(tp);beep(tp=='X'?520:400,.08);const w=win(tb),ai=$('#tMode').value=='ai';
  if(w){ta=false;w.forEach(k=>tc()[k].classList.add('win'));tsc[tp]++;tr++;$('#s'+tp.toLowerCase()).textContent=tsc[tp];
    if(ai&&tp=='X'){S.tw++;tSt('Kamu menang! 🎉');winFx({easy:5,medium:10,hard:20,extreme:40}[$('#tDiff').value])}else{tSt(ai?'Komputer menang 🤖':`Pemain ${tp} menang! 🎉`);beep(200,.3,'sawtooth')}save();return}
  if(!tb.includes('')){ta=false;tsc.D++;tr++;$('#sd').textContent=tsc.D;tSt('Seri! 🤝');return}
  tp=tp=='X'?'O':'X';if(ai&&tp=='O'){tSt('Komputer berpikir…');setTimeout(tAI,450)}else tSt(ai?'Giliranmu (X)':`Giliran ${tp}`)}
function tAI(){if(!ta)return;const e=tb.map((v,i)=>v?null:i).filter(v=>v!==null),p={easy:0,medium:.5,hard:.85,extreme:1}[$('#tDiff').value];tMove(e.length==9||Math.random()>p?e[rnd(e.length)]:mm(tb.slice(),'O').m)}
$('#tNew').onclick=tInit;$('#tMode').onchange=$('#tDiff').onchange=()=>{tr=0;tInit()};

/* ===== ULAR TANGGA ===== */
const N=6,T=36,SL={2:14,6:17,11:23,20:31,16:4,27:9,33:19,35:24};let pos,turn,busy,gid=0;
function sInit(){gid++;pos=[1,1];turn=0;busy=false;$('#sRoll').disabled=false;$('#sDice').textContent='🎲';sStat();sDraw()}
const pn=i=>$('#sMode').value=='ai'?(i?'Komputer (biru)':'Kamu (merah)'):`Pemain ${i+1} (${i?'biru':'merah'})`;
const sStat=()=>$('#sSt').textContent='Giliran '+pn(turn);
function sDraw(){const b=$('#sBoard');b.innerHTML='';for(let r=N-1;r>=0;r--)for(let c=0;c<N;c++){const n=r%2?r*N+(N-1-c)+1:r*N+c+1,t=SL[n],d=document.createElement('div');d.className='sc'+(t?(t>n?' lad':' snk'):'')+((r+c)%2?' alt':'');d.innerHTML=`<b>${n==T?'🏆':n}</b>${t?`<i>${t>n?'🪜':'🐍'}→${t}</i>`:''}<span>${pos.map((p,i)=>p==n?`<em class="tk p${i}"></em>`:'').join('')}</span>`;b.appendChild(d)}}
async function sRoll(){if(busy)return;busy=true;const g=gid;$('#sRoll').disabled=true;const f='⚀⚁⚂⚃⚄⚅';
  for(let i=0;i<8;i++){$('#sDice').textContent=f[rnd(6)];beep(300+i*40,.04);await sleep(60)}if(g!=gid)return;
  const d=1+rnd(6);$('#sDice').textContent=f[d-1];const to=Math.min(T,pos[turn]+d);
  while(pos[turn]<to){pos[turn]++;sDraw();beep(500,.05);await sleep(170)}if(g!=gid)return;
  if(SL[to]){const up=SL[to]>to;toast(up?'Naik tangga! 🪜':'Digigit ular! 🐍');beep(up?880:160,.3,'triangle');await sleep(550);if(g!=gid)return;pos[turn]=SL[to];sDraw();await sleep(300);if(g!=gid)return}
  if(pos[turn]==T){const ai=$('#sMode').value=='ai';$('#sSt').textContent=pn(turn)+' menang! 🎉';if(!ai||turn==0){if(ai)S.sw++;winFx(ai?25:10)}else beep(200,.4,'sawtooth');save();return}
  if(d!=6)turn=1-turn;else toast('Dapat 6, jalan lagi! 🎲');sStat();busy=false;
  if($('#sMode').value=='ai'&&turn==1)setTimeout(sRoll,700);else $('#sRoll').disabled=false}
$('#sRoll').onclick=sRoll;$('#sNew').onclick=sInit;$('#sMode').onchange=sInit;

/* ===== FLIP CARD ===== */
const IC=Array.from('🍎🍌🍇🍉🍓🍒🍍🥝🍑🍋🍊🥥🍅🥑🍆🌽🥕🍄'),FD={easy:[4,3],medium:[4,4],hard:[5,4],extreme:[6,5]};let fT,fS,fM,fF,fL,fLock,fOn;
function fInit(){clearInterval(fT);fS=fM=0;fF=null;fLock=fOn=false;const d=$('#fDiff').value,[c,r]=FD[d],n=c*r/2;fL=n;$('#fTime').textContent=0;$('#fMoves').textContent=0;$('#fLeft').textContent=n;
  const b=$('#fBoard');b.style.setProperty('--c',c);b.innerHTML='';[...IC.slice(0,n),...IC.slice(0,n)].sort(()=>Math.random()-.5).forEach(e=>{const k=document.createElement('button');k.className='fc';k.dataset.e=e;k.innerHTML=`<span class="in"><span class="fr">❓</span><span class="bk">${e}</span></span>`;k.onclick=()=>fFlip(k);b.appendChild(k)});
  const bs=S.best['f'+d];$('#fBest').textContent=bs?`Rekor: ${bs.t} detik · ${bs.m} langkah`:'Belum ada rekor di level ini'}
function fFlip(k){if(fLock||k.classList.contains('up')||k.classList.contains('ok'))return;
  if(!fOn){fOn=true;fT=setInterval(()=>$('#fTime').textContent=++fS,1000)}
  k.classList.add('up');beep(520,.05);if(!fF){fF=k;return}
  fM++;$('#fMoves').textContent=fM;const a=fF;fF=null;
  if(a.dataset.e==k.dataset.e){a.classList.add('ok');k.classList.add('ok');beep(880,.15,'triangle');$('#fLeft').textContent=--fL;if(!fL)fWin()}
  else{fLock=true;setTimeout(()=>{a.classList.remove('up');k.classList.remove('up');fLock=false},750)}}
function fWin(){clearInterval(fT);const d=$('#fDiff').value,o=S.best['f'+d];let nr='';if(!o||fS<o.t){S.best['f'+d]={t:fS,m:fM};nr=' Rekor baru! 🏅'}save();
  $('#fBest').textContent=`Selesai ${fS} detik, ${fM} langkah.${nr}`;winFx({easy:5,medium:12,hard:20,extreme:35}[d])}
$('#fNew').onclick=$('#fDiff').onchange=fInit;

/* ===== WORDLE ===== */
const WL='PASAR MAKAN SURAT POHON PINTU LAMPU RUMAH KAPAL KERAS MANIS PUTIH MERAH HITAM GELAP BEBAS DUDUK JALAN MIMPI CERIA TANAH BERAS HUJAN SABUN ANGIN BULAN KURSI MURID KELAS BUNGA TELUR GARAM CABAI MELON JAMBU LALAT SEMUT LEBAH BUAYA ZEBRA KATAK LILIN KUNCI MOTOR JERUK PASIR BUKIT GAJAH SINGA HEWAN'.split(' ').filter(w=>w.length==5);
let wt,wg,wr,wo;const wm=m=>$('#wMsg').textContent=m,wtl=(r,c)=>$(`#wt${r}${c}`);
function wInit(){wt=WL[rnd(WL.length)];wg='';wr=0;wo=false;wm('Tebak kata 5 huruf!');const g=$('#wGrid');g.innerHTML='';
  for(let r=0;r<6;r++){const d=document.createElement('div');d.className='wr';d.id='wr'+r;for(let c=0;c<5;c++){const t=document.createElement('div');t.className='wt';t.id=`wt${r}${c}`;d.appendChild(t)}g.appendChild(d)}
  const k=$('#wKb');k.innerHTML='';['QWERTYUIOP','ASDFGHJKL','ENTER ZXCVBNM ⌫'].forEach(row=>{const d=document.createElement('div');d.className='kr';(row.includes(' ')?row.split(' ').flatMap(x=>x=='ENTER'||x=='⌫'?[x]:[...x]):[...row]).forEach(ch=>{const b=document.createElement('div');b.className='key'+(ch.length>1||ch=='⌫'?' lg':'');b.id='k'+ch;b.textContent=ch;b.onclick=()=>wIn(ch);d.appendChild(b)});k.appendChild(d)});
  const s=S.wd;$('#wStat').textContent=`Menang ${s.w} · Kalah ${s.l} · Streak ${s.s}`}
function wIn(k){if(wo)return;if(k=='⌫')wg=wg.slice(0,-1);
  else if(k=='ENTER'){if(wg.length<5){wShake('Kata harus 5 huruf!');return}if($('#wStrict').checked&&!WL.includes(wg)){wShake('Kata tidak ada di daftar game');return}wSub();return}
  else if(wg.length<5&&k.length==1)wg+=k;for(let c=0;c<5;c++){const t=wtl(wr,c);t.textContent=wg[c]||'';t.classList.toggle('f',!!wg[c])}beep(450,.03)}
function wShake(m){wm(m);const r=$('#wr'+wr);r.classList.add('shake');setTimeout(()=>r.classList.remove('shake'),400);beep(150,.15,'square')}
function wSub(){const g=wg,row=wr,ta=[...wt],col=Array(5).fill('absent');wo=true;
  for(let i=0;i<5;i++)if(g[i]==ta[i]){col[i]='correct';ta[i]=null}
  for(let i=0;i<5;i++)if(col[i]!='correct'){const j=ta.indexOf(g[i]);if(j>-1){col[i]='present';ta[j]=null}}
  for(let i=0;i<5;i++){const t=wtl(row,i);t.style.animationDelay=i*.12+'s';t.classList.add('rev');setTimeout(()=>{t.classList.add(col[i]);const k=$('#k'+g[i]);if(k&&!k.classList.contains('correct')&&!(k.classList.contains('present')&&col[i]=='absent'))k.className='key '+col[i];beep(300+i*90,.06)},i*120+250)}
  wr++;wg='';
  setTimeout(()=>{if(g==wt){S.wd.w++;S.wd.s++;wm(`Hebat! Tebakan ke-${row+1} 🎉`);winFx(Math.max(10,40-row*6))}
    else if(wr==6){S.wd.l++;S.wd.s=0;wm('Game over! Katanya: '+wt);beep(180,.4,'sawtooth')}
    else{wo=false;wm(`Kesempatan ke-${wr+1} dari 6`);return}
    wo=true;save();$('#wStat').textContent=`Menang ${S.wd.w} · Kalah ${S.wd.l} · Streak ${S.wd.s}`},900)}
document.addEventListener('keydown',e=>{if(!$('#wd').classList.contains('on')||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key=='Enter')wIn('ENTER');else if(e.key=='Backspace')wIn('⌫');else if(/^[a-z]$/i.test(e.key))wIn(e.key.toUpperCase())});
$('#wNew').onclick=wInit;
xpUI();hub();
</script>
